<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 46px "Arial", "Microsoft YaHei", sans-serif; fill: #111111; }
      .subtitle { font: 400 23px "Arial", "Microsoft YaHei", sans-serif; fill: #444444; }
      .label { font: 700 25px "Arial", "Microsoft YaHei", sans-serif; fill: #111111; }
      .small { font: 400 20px "Arial", "Microsoft YaHei", sans-serif; fill: #222222; }
      .tiny { font: 400 16px "Arial", "Microsoft YaHei", sans-serif; fill: #222222; }
      .nt { fill: #ffffff; stroke: #161616; stroke-width: 2.2; }
      .nt-blue { fill: #dceeff; stroke: #1f5f99; stroke-width: 2.2; }
      .nt-green { fill: #dcf7e8; stroke: #268252; stroke-width: 2.2; }
      .nt-orange { fill: #ffe8cb; stroke: #aa6415; stroke-width: 2.2; }
      .nt-purple { fill: #eee0ff; stroke: #6a3aa8; stroke-width: 2.2; }
      .nt-red { fill: #ffe0e0; stroke: #b33131; stroke-width: 2.2; }
      .stem { stroke: #222222; stroke-width: 3; stroke-linecap: round; }
      .pair { stroke: #777777; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .arrow { stroke: #111111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .callout { fill: #f7f7f7; stroke: #222222; stroke-width: 2; rx: 14; }
      .domain-acceptor { stroke: #1f5f99; stroke-width: 7; fill: none; stroke-linecap: round; }
      .domain-d { stroke: #268252; stroke-width: 7; fill: none; stroke-linecap: round; }
      .domain-anti { stroke: #aa6415; stroke-width: 7; fill: none; stroke-linecap: round; }
      .domain-var { stroke: #6a3aa8; stroke-width: 7; fill: none; stroke-linecap: round; }
      .domain-t { stroke: #b33131; stroke-width: 7; fill: none; stroke-linecap: round; }
      .legend-line { stroke-width: 7; stroke-linecap: round; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1200"/>
  <text class="title" x="72" y="82">tRNA structure schematic / tRNA 结构示意图</text>
  <text class="subtitle" x="75" y="122">Canonical cloverleaf secondary structure with key functional sites and a compact L-shaped tertiary view</text>

  <!-- Legend -->
  <g transform="translate(1125,55)">
    <rect class="callout" x="0" y="0" width="610" height="112"/>
    <line class="legend-line" x1="28" y1="28" x2="88" y2="28" stroke="#1f5f99"/><text class="tiny" x="105" y="34">Acceptor stem / CCA amino acid attachment</text>
    <line class="legend-line" x1="28" y1="58" x2="88" y2="58" stroke="#268252"/><text class="tiny" x="105" y="64">D arm / folding and modification contacts</text>
    <line class="legend-line" x1="28" y1="88" x2="88" y2="88" stroke="#aa6415"/><text class="tiny" x="105" y="94">Anticodon arm / codon recognition</text>
    <line class="legend-line" x1="360" y1="28" x2="420" y2="28" stroke="#6a3aa8"/><text class="tiny" x="437" y="34">Variable loop</text>
    <line class="legend-line" x1="360" y1="58" x2="420" y2="58" stroke="#b33131"/><text class="tiny" x="437" y="64">TΨC arm / ribosome & EF contacts</text>
  </g>

  <!-- Domain outlines -->
  <path class="domain-acceptor" d="M845 210 L845 520 M910 210 L910 520"/>
  <path class="domain-d" d="M790 520 C650 505 555 560 540 675 C525 790 660 855 780 805"/>
  <path class="domain-anti" d="M845 520 L845 775 C805 840 810 930 878 972 C946 930 951 840 910 775 L910 520"/>
  <path class="domain-var" d="M910 560 C1005 595 1045 657 1012 720"/>
  <path class="domain-t" d="M965 520 C1108 502 1205 560 1220 675 C1235 790 1100 855 980 805"/>

  <!-- Acceptor stem paired nucleotides -->
  <g>
    <line class="pair" x1="845" y1="235" x2="910" y2="235"/>
    <line class="pair" x1="845" y1="275" x2="910" y2="275"/>
    <line class="pair" x1="845" y1="315" x2="910" y2="315"/>
    <line class="pair" x1="845" y1="355" x2="910" y2="355"/>
    <line class="pair" x1="845" y1="395" x2="910" y2="395"/>
    <line class="pair" x1="845" y1="435" x2="910" y2="435"/>
    <line class="pair" x1="845" y1="475" x2="910" y2="475"/>
    <circle class="nt-blue" cx="845" cy="235" r="18"/><text class="tiny" x="838" y="242">1</text>
    <circle class="nt-blue" cx="910" cy="235" r="18"/><text class="tiny" x="899" y="242">72</text>
    <circle class="nt-blue" cx="845" cy="275" r="18"/><text class="tiny" x="837" y="282">2</text>
    <circle class="nt-blue" cx="910" cy="275" r="18"/><text class="tiny" x="899" y="282">71</text>
    <circle class="nt-blue" cx="845" cy="315" r="18"/><text class="tiny" x="837" y="322">3</text>
    <circle class="nt-blue" cx="910" cy="315" r="18"/><text class="tiny" x="899" y="322">70</text>
    <circle class="nt-blue" cx="845" cy="355" r="18"/><text class="tiny" x="837" y="362">4</text>
    <circle class="nt-blue" cx="910" cy="355" r="18"/><text class="tiny" x="899" y="362">69</text>
    <circle class="nt-blue" cx="845" cy="395" r="18"/><text class="tiny" x="837" y="402">5</text>
    <circle class="nt-blue" cx="910" cy="395" r="18"/><text class="tiny" x="899" y="402">68</text>
    <circle class="nt-blue" cx="845" cy="435" r="18"/><text class="tiny" x="837" y="442">6</text>
    <circle class="nt-blue" cx="910" cy="435" r="18"/><text class="tiny" x="899" y="442">67</text>
    <circle class="nt-blue" cx="845" cy="475" r="18"/><text class="tiny" x="837" y="482">7</text>
    <circle class="nt-blue" cx="910" cy="475" r="18"/><text class="tiny" x="899" y="482">66</text>
    <text class="small" x="805" y="185">5' end</text>
    <path class="arrow" d="M810 190 L838 220"/>
    <text class="label" x="938" y="202">3' CCA tail</text>
    <text class="small" x="940" y="235">A76 = amino acid attachment site</text>
    <circle class="nt-blue" cx="948" cy="175" r="18"/><text class="tiny" x="941" y="182">C</text>
    <circle class="nt-blue" cx="990" cy="175" r="18"/><text class="tiny" x="983" y="182">C</text>
    <circle class="nt-blue" cx="1032" cy="175" r="18"/><text class="tiny" x="1025" y="182">A</text>
    <line class="stem" x1="925" y1="205" x2="948" y2="175"/>
  </g>

