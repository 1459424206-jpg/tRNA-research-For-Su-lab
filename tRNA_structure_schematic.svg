    <line class="pair" x1="790" y1="582" x2="705" y2="582"/>
    <line class="pair" x1="785" y1="622" x2="700" y2="622"/>
    <circle class="nt-green" cx="800" cy="542" r="18"/><text class="tiny" x="789" y="549">10</text>
    <circle class="nt-green" cx="725" cy="542" r="18"/><text class="tiny" x="714" y="549">25</text>
    <circle class="nt-green" cx="790" cy="582" r="18"/><text class="tiny" x="779" y="589">11</text>
    <circle class="nt-green" cx="705" cy="582" r="18"/><text class="tiny" x="694" y="589">24</text>
    <circle class="nt-green" cx="785" cy="622" r="18"/><text class="tiny" x="774" y="629">12</text>
    <circle class="nt-green" cx="700" cy="622" r="18"/><text class="tiny" x="689" y="629">23</text>
    <circle class="nt-green" cx="650" cy="640" r="18"/><text class="tiny" x="639" y="647">16</text>
    <circle class="nt-green" cx="620" cy="680" r="18"/><text class="tiny" x="609" y="687">17</text>
    <circle class="nt-green" cx="640" cy="725" r="18"/><text class="tiny" x="629" y="732">20</text>
    <circle class="nt-green" cx="688" cy="750" r="18"/><text class="tiny" x="677" y="757">21</text>
    <circle class="nt-green" cx="735" cy="735" r="18"/><text class="tiny" x="724" y="742">22</text>
    <text class="label" x="415" y="600">D arm</text>
    <text class="small" x="365" y="635">contains dihydrouridine-rich loop</text>
    <text class="small" x="365" y="666">important for folding and enzyme recognition</text>
    <path class="arrow" d="M555 635 C585 625 610 620 640 640"/>
  </g>

  <!-- Anticodon arm -->
  <g>
    <line class="pair" x1="845" y1="555" x2="910" y2="555"/>
    <line class="pair" x1="845" y1="595" x2="910" y2="595"/>
    <line class="pair" x1="845" y1="635" x2="910" y2="635"/>
    <line class="pair" x1="845" y1="675" x2="910" y2="675"/>
    <line class="pair" x1="845" y1="715" x2="910" y2="715"/>
    <circle class="nt-orange" cx="845" cy="555" r="18"/><text class="tiny" x="834" y="562">27</text>
    <circle class="nt-orange" cx="910" cy="555" r="18"/><text class="tiny" x="899" y="562">43</text>
    <circle class="nt-orange" cx="845" cy="595" r="18"/><text class="tiny" x="834" y="602">28</text>
    <circle class="nt-orange" cx="910" cy="595" r="18"/><text class="tiny" x="899" y="602">42</text>
    <circle class="nt-orange" cx="845" cy="635" r="18"/><text class="tiny" x="834" y="642">29</text>
    <circle class="nt-orange" cx="910" cy="635" r="18"/><text class="tiny" x="899" y="642">41</text>
    <circle class="nt-orange" cx="845" cy="675" r="18"/><text class="tiny" x="834" y="682">30</text>
    <circle class="nt-orange" cx="910" cy="675" r="18"/><text class="tiny" x="899" y="682">40</text>
    <circle class="nt-orange" cx="845" cy="715" r="18"/><text class="tiny" x="834" y="722">31</text>
    <circle class="nt-orange" cx="910" cy="715" r="18"/><text class="tiny" x="899" y="722">39</text>
    <circle class="nt-orange" cx="823" cy="790" r="18"/><text class="tiny" x="812" y="797">32</text>
    <circle class="nt-orange" cx="852" cy="832" r="18"/><text class="tiny" x="841" y="839">33</text>
    <circle class="nt-red" cx="878" cy="870" r="21"/><text class="tiny" x="866" y="877">34</text>
    <circle class="nt-red" cx="922" cy="832" r="21"/><text class="tiny" x="910" y="839">35</text>
    <circle class="nt-red" cx="951" cy="790" r="21"/><text class="tiny" x="939" y="797">36</text>
    <circle class="nt-orange" cx="910" cy="900" r="18"/><text class="tiny" x="899" y="907">37</text>
    <text class="label" x="705" y="1032">Anticodon loop</text>
    <text class="small" x="653" y="1065">positions 34-36 pair with mRNA codon</text>
    <text class="small" x="663" y="1095">U34 is a major wobble/modification site</text>
    <path class="arrow" d="M840 1010 C850 965 865 920 878 890"/>
  </g>

  <!-- Variable loop -->
  <g>
    <circle class="nt-purple" cx="982" cy="585" r="17"/><text class="tiny" x="971" y="592">44</text>
    <circle class="nt-purple" cx="1018" cy="618" r="17"/><text class="tiny" x="1007" y="625">45</text>
    <circle class="nt-purple" cx="1034" cy="664" r="17"/><text class="tiny" x="1023" y="671">46</text>
    <circle class="nt-purple" cx="1010" cy="710" r="17"/><text class="tiny" x="995" y="717">47</text>
    <text class="label" x="1100" y="590">Variable loop</text>
    <text class="small" x="1100" y="624">length varies by tRNA class</text>
    <text class="small" x="1100" y="654">important for aaRS specificity</text>
    <path class="arrow" d="M1090 620 C1060 620 1040 635 1032 662"/>
  </g>

  <!-- T arm -->
  <g>
    <line class="pair" x1="955" y1="542" x2="1030" y2="542"/>
    <line class="pair" x1="965" y1="582" x2="1050" y2="582"/>
    <line class="pair" x1="970" y1="622" x2="1055" y2="622"/>
    <circle class="nt-red" cx="955" cy="542" r="18"/><text class="tiny" x="944" y="549">49</text>
    <circle class="nt-red" cx="1030" cy="542" r="18"/><text class="tiny" x="1019" y="549">65</text>
    <circle class="nt-red" cx="965" cy="582" r="18"/><text class="tiny" x="954" y="589">50</text>
    <circle class="nt-red" cx="1050" cy="582" r="18"/><text class="tiny" x="1039" y="589">64</text>
    <circle class="nt-red" cx="970" cy="622" r="18"/><text class="tiny" x="959" y="629">51</text>
    <circle class="nt-red" cx="1055" cy="622" r="18"/><text class="tiny" x="1044" y="629">63</text>
    <circle class="nt-red" cx="1105" cy="640" r="18"/><text class="tiny" x="1094" y="647">54</text>
    <circle class="nt-red" cx="1135" cy="680" r="18"/><text class="tiny" x="1124" y="687">55</text>
    <circle class="nt-red" cx="1115" cy="725" r="18"/><text class="tiny" x="1104" y="732">58</text>
    <circle class="nt-red" cx="1067" cy="750" r="18"/><text class="tiny" x="1056" y="757">59</text>
    <circle class="nt-red" cx="1020" cy="735" r="18"/><text class="tiny" x="1009" y="742">60</text>
    <text class="label" x="1265" y="600">TΨC arm</text>
    <text class="small" x="1265" y="635">ribosome and elongation factor contacts</text>
    <text class="small" x="1265" y="666">Ψ55 is a conserved modification site</text>
    <path class="arrow" d="M1260 635 C1210 625 1160 625 1105 640"/>
  </g>

  <!-- Central joints -->
  <g>
    <circle class="nt" cx="845" cy="520" r="18"/><text class="tiny" x="834" y="527">8</text>
    <circle class="nt" cx="878" cy="520" r="18"/><text class="tiny" x="867" y="527">9</text>
    <circle class="nt" cx="910" cy="520" r="18"/><text class="tiny" x="899" y="527">48</text>
    <line class="stem" x1="845" y1="493" x2="845" y2="535"/>
    <line class="stem" x1="910" y1="493" x2="910" y2="535"/>
  </g>

  <!-- Key sites callout -->
  <g transform="translate(80,780)">
    <rect class="callout" x="0" y="0" width="545" height="290"/>
    <text class="label" x="24" y="42">Key functional positions</text>
    <text class="small" x="24" y="82">• 3' CCA / A76: amino acid attachment</text>
    <text class="small" x="24" y="118">• Acceptor stem: identity elements for aaRS</text>
    <text class="small" x="24" y="154">• D/T loops: tertiary L-shape stabilization</text>
    <text class="small" x="24" y="190">• Anticodon 34-36: codon recognition</text>
    <text class="small" x="24" y="226">• U34/A37/C32: frequent modification hot spots</text>
    <text class="small" x="24" y="262">• Variable loop: tRNA class-specific recognition</text>
  </g>

  <!-- Tertiary L-shape mini inset -->
  <g transform="translate(1210,790)">
    <rect class="callout" x="0" y="0" width="500" height="310"/>
    <text class="label" x="24" y="42">3D tertiary fold: L-shaped tRNA</text>
    <path d="M80 225 C105 130 178 78 260 78" stroke="#1f5f99" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M260 78 C348 78 402 128 430 205" stroke="#b33131" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M80 225 C118 255 178 260 232 232" stroke="#aa6415" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="74" cy="232" r="18" fill="#ffe8cb" stroke="#aa6415" stroke-width="3"/>
    <text class="tiny" x="30" y="276">Anticodon end</text>
    <circle cx="438" cy="210" r="18" fill="#dceeff" stroke="#1f5f99" stroke-width="3"/>
    <text class="tiny" x="315" y="252">3' CCA / amino acid end</text>
    <text class="small" x="24" y="296">Cloverleaf is the 2D map; the real molecule folds into an L.</text>
  </g>

  <!-- Footer -->
  <text class="tiny" x="74" y="1155">Schematic uses conventional tRNA numbering; exact nucleotide identities and loop lengths vary by tRNA species.</text>
</svg>
